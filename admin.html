<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Ứng Viên - Recruitment Admin</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            background-color: #f8fafc;
            color: #1e293b;
        }
        .admin-header {
            background: linear-gradient(135deg, #2563eb, #1e40af);
            color: white;
            padding: 2rem 1rem;
            text-align: center;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
        }
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem 3rem;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        .stat-card {
            background: white;
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
            text-align: center;
        }
        .stat-card h3 {
            font-size: 0.875rem;
            color: #64748b;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
        }
        .stat-card .value {
            font-size: 2rem;
            font-weight: 700;
            color: #2563eb;
        }
        .table-container {
            background: white;
            border-radius: 1rem;
            box-shadow: 0 1px 3px 0 rgb(0 0 0 / 0.1);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }
        th {
            background: #f1f5f9;
            padding: 1rem;
            font-weight: 600;
            color: #475569;
            border-bottom: 1px solid #e2e8f0;
        }
        td {
            padding: 1rem;
            border-bottom: 1px solid #f1f5f9;
            vertical-align: top;
        }
        tr:hover {
            background-color: #f8fafc;
        }
        .location-tag {
            display: inline-block;
            background: #e0f2fe;
            color: #0369a1;
            padding: 0.25rem 0.5rem;
            border-radius: 0.375rem;
            font-size: 0.75rem;
            margin: 0.125rem;
        }
        .date-cell {
            color: #64748b;
            font-size: 0.875rem;
        }
        .loading-overlay {
            display: flex;
            justify-content: center;
            padding: 4rem;
        }
        .btn-refresh {
            background: #2563eb;
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
            margin-bottom: 1rem;
        }
        .btn-refresh:hover {
            background: #1d4ed8;
        }
        .empty-state {
            text-align: center;
            padding: 4rem;
            color: #64748b;
        }
    </style>
</head>
<body>
    <header class="admin-header">
        <h1>Bảng Quản Trị Tuyển Dụng</h1>
        <p>Thống kê và Danh sách Ứng viên gửi về</p>
    </header>

    <main class="admin-container">
        <div class="stats-grid">
            <div class="stat-card">
                <h3>Tổng số ứng viên</h3>
                <div class="value" id="totalCount">0</div>
            </div>
            <div class="stat-card">
                <h3>Ứng viên mới hôm nay</h3>
                <div class="value" id="todayCount">0</div>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center;">
            <button class="btn-refresh" id="refreshBtn">
                <i class="fas fa-sync-alt"></i> Làm mới dữ liệu
            </button>
            <div id="lastUpdated" class="date-cell"></div>
        </div>

        <div class="table-container">
            <table id="adminTable">
                <thead>
                    <tr>
                        <th>Ngày gửi</th>
                        <th>Họ và Tên</th>
                        <th>Số điện thoại</th>
                        <th>Địa chỉ</th>
                        <th>Khu vực đăng ký</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- Trình tải dữ liệu sẽ xuất hiện ở đây -->
                    <tr class="loading-overlay">
                        <td colspan="5">Đang tải dữ liệu...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </main>

    <script type="module" src="admin.js"></script>
</body>
</html>
